<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>
  
  <!-- Grid lines -->
  <g stroke="#2a2a4e" stroke-width="0.5" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
  </g>
  
  <!-- T-piece (purple) -->
  <g fill="#9b59b6">
    <rect x="62" y="22" width="36" height="36" rx="2"/>
    <rect x="22" y="58" width="36" height="36" rx="2"/>
    <rect x="62" y="58" width="36" height="36" rx="2"/>
    <rect x="102" y="58" width="36" height="36" rx="2"/>
  </g>
  
  <!-- I-piece (cyan) -->
  <g fill="#00f5ff">
    <rect x="142" y="98" width="36" height="36" rx="2"/>
    <rect x="142" y="134" width="36" height="36" rx="2"/>
    <rect x="142" y="170" width="36" height="28" rx="2"/>
  </g>
  
  <!-- O-piece (yellow) -->
  <g fill="#ffd700">
    <rect x="22" y="138" width="36" height="36" rx="2"/>
    <rect x="58" y="138" width="36" height="36" rx="2"/>
    <rect x="22" y="174" width="36" height="24" rx="2"/>
    <rect x="58" y="174" width="36" height="24" rx="2"/>
  </g>
  
  <!-- S-piece (green) -->
  <g fill="#2ecc71">
    <rect x="62" y="98" width="36" height="36" rx="2"/>
    <rect x="98" y="98" width="36" height="36" rx="2"/>
    <rect x="98" y="134" width="36" height="36" rx="2"/>
  </g>
  
  <!-- Highlight effects -->
  <g fill="rgba(255,255,255,0.2)">
    <rect x="62" y="22" width="36" height="4" rx="1"/>
    <rect x="22" y="58" width="36" height="4" rx="1"/>
    <rect x="142" y="98" width="36" height="4" rx="1"/>
    <rect x="22" y="138" width="36" height="4" rx="1"/>
    <rect x="62" y="98" width="36" height="4" rx="1"/>
  </g>
</svg>

