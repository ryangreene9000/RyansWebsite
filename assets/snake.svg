<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>
  
  <!-- Grid lines -->
  <g stroke="#2a2a4e" stroke-width="0.5" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
  </g>
  
  <!-- Snake body -->
  <g fill="#16a34a">
    <rect x="42" y="82" width="36" height="36" rx="4"/>
    <rect x="82" y="82" width="36" height="36" rx="4"/>
    <rect x="82" y="42" width="36" height="36" rx="4"/>
    <rect x="122" y="42" width="36" height="36" rx="4"/>
    <rect x="122" y="82" width="36" height="36" rx="4"/>
    <rect x="122" y="122" width="36" height="36" rx="4"/>
  </g>
  
  <!-- Snake head -->
  <rect x="82" y="122" width="36" height="36" rx="4" fill="#22c55e"/>
  
  <!-- Snake eyes -->
  <circle cx="90" cy="136" r="4" fill="white"/>
  <circle cx="106" cy="136" r="4" fill="white"/>
  <circle cx="90" cy="136" r="2" fill="#1a1a2e"/>
  <circle cx="106" cy="136" r="2" fill="#1a1a2e"/>
  
  <!-- Food (apple) -->
  <circle cx="60" cy="140" r="14" fill="#ef4444"/>
  <ellipse cx="56" cy="134" rx="4" ry="3" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Apple stem -->
  <path d="M60 126 Q62 120 58 116" stroke="#65a30d" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>

