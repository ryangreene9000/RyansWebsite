<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Snake - A classic game recreated by Ryan Greene">
    <title>Snake | Ryan Greene</title>
    
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --color-primary: #22c55e;
            --color-primary-light: #4ade80;
            --color-bg: #09090b;
            --color-bg-alt: #18181b;
            --color-text: #fafafa;
            --color-text-muted: #a1a1aa;
            --color-border: #27272a;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .game-header {
            padding: 1rem 2rem;
            background: var(--color-bg-alt);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9375rem;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--color-primary-light);
        }
        
        .game-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .game-title span {
            color: var(--color-primary-light);
        }
        
        /* Main Content */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            gap: 1.5rem;
        }
        
        /* Game Layout */
        .game-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* Game Canvas Area */
        .game-canvas-wrapper {
            position: relative;
            background: #1a1a2e;
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        #snake-canvas {
            display: block;
            border: 2px solid #2a2a4e;
            border-radius: 4px;
            background: #0f0f1a;
        }
        
        /* Game Overlay */
        .game-overlay {
            position: absolute;
            inset: 4px;
            background: rgba(9, 9, 11, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            z-index: 10;
            transition: opacity 0.2s;
        }
        
        .game-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .overlay-content {
            text-align: center;
        }
        
        .overlay-content h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--color-primary-light);
        }
        
        .overlay-content p {
            color: var(--color-text-muted);
            margin-bottom: 1.5rem;
        }
        
        /* Sidebar */
        .game-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 180px;
        }
        
        /* Stats Panel */
        .stats-panel {
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--color-border);
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }
        
        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-primary-light);
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Speed Panel */
        .speed-panel {
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .speed-panel h3 {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .speed-buttons {
            display: flex;
            gap: 0.375rem;
        }
        
        .speed-btn {
            flex: 1;
            padding: 0.5rem;
            border-radius: 6px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .speed-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary-light);
        }
        
        .speed-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }
        
        /* Controls Panel */
        .controls-panel {
            display: flex;
            gap: 0.5rem;
        }
        
        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-primary {
            background: var(--color-primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--color-primary-light);
        }
        
        .btn-secondary {
            flex: 1;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
        }
        
        .btn-secondary:hover {
            border-color: var(--color-primary);
            color: var(--color-primary-light);
        }
        
        /* How to Play Section */
        .how-to-play {
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .how-to-play h3 {
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
            color: var(--color-primary-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .how-to-play-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .how-to-play-list li {
            padding: 0.375rem 0;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .how-to-play-list kbd {
            padding: 0.125rem 0.375rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 3px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            min-width: 24px;
            text-align: center;
        }
        
        .how-to-play-tip {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            padding-top: 0.5rem;
            border-top: 1px solid var(--color-border);
            margin-top: 0.5rem;
        }
        
        /* Mobile Controls */
        .mobile-controls {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .mobile-btn {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mobile-btn:active {
            background: var(--color-primary);
            color: white;
            transform: scale(0.95);
        }
        
        /* Responsive */
        @media (max-width: 700px) {
            .game-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .game-layout {
                flex-direction: column;
                align-items: center;
            }
            
            .game-sidebar {
                width: 100%;
                max-width: 400px;
            }
            
            #snake-canvas {
                width: 100%;
                max-width: 400px;
                height: auto;
                aspect-ratio: 1 / 1;
            }
            
            .mobile-controls {
                display: flex;
            }
            
            .how-to-play {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <a href="/games.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Games
        </a>
        <h1 class="game-title">🐍 <span>Snake</span></h1>
        <div style="width: 120px;"></div>
    </header>

    <!-- Game Container -->
    <main class="game-container">
        <div class="game-layout">
            <!-- Game Canvas -->
            <div class="game-canvas-wrapper">
                <canvas id="snake-canvas" width="400" height="400"></canvas>
                <div class="game-overlay" id="game-overlay">
                    <div class="overlay-content">
                        <h2 id="overlay-title">Snake</h2>
                        <p id="overlay-message">Press Start to Play</p>
                        <button id="start-btn" class="btn btn-primary">Start Game</button>
                    </div>
                </div>
            </div>

            <!-- Side Panel -->
            <div class="game-sidebar">
                <!-- Stats -->
                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">High Score</span>
                        <span class="stat-value" id="high-score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Length</span>
                        <span class="stat-value" id="length">3</span>
                    </div>
                </div>

                <!-- Speed Selection -->
                <div class="speed-panel">
                    <h3>Speed</h3>
                    <div class="speed-buttons">
                        <button class="speed-btn" data-speed="slow">Slow</button>
                        <button class="speed-btn active" data-speed="normal">Normal</button>
                        <button class="speed-btn" data-speed="fast">Fast</button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls-panel">
                    <button id="pause-btn" class="btn btn-secondary">Pause</button>
                    <button id="restart-btn" class="btn btn-secondary">Restart</button>
                </div>

                <!-- How to Play -->
                <div class="how-to-play">
                    <h3>How to Play</h3>
                    <ul class="how-to-play-list">
                        <li><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Move</li>
                        <li><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Alt controls</li>
                        <li><kbd>P</kbd> Pause</li>
                        <li><kbd>R</kbd> Restart</li>
                    </ul>
                    <p class="how-to-play-tip">🍎 Eat food to grow. Avoid walls and yourself!</p>
                </div>

                <!-- Mobile Controls -->
                <div class="mobile-controls" id="mobile-controls">
                    <div class="mobile-row">
                        <button class="mobile-btn" id="mobile-up">↑</button>
                    </div>
                    <div class="mobile-row">
                        <button class="mobile-btn" id="mobile-left">←</button>
                        <button class="mobile-btn" id="mobile-down">↓</button>
                        <button class="mobile-btn" id="mobile-right">→</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="snake.js"></script>
</body>
</html>
