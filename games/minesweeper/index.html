<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Minesweeper - A classic game recreated by Ryan Greene">
    <title>Minesweeper | Ryan Greene</title>
    
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --color-primary: #0d9488;
            --color-primary-light: #14b8a6;
            --color-bg: #09090b;
            --color-bg-alt: #18181b;
            --color-text: #fafafa;
            --color-text-muted: #a1a1aa;
            --color-border: #27272a;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .game-header {
            padding: 1rem 2rem;
            background: var(--color-bg-alt);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9375rem;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--color-primary-light);
        }
        
        .game-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .game-title span {
            color: var(--color-primary-light);
        }
        
        /* Main Content */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 1.5rem;
        }
        
        /* Difficulty Selector */
        .difficulty-selector {
            display: flex;
            gap: 0.5rem;
        }
        
        .difficulty-btn {
            padding: 0.5rem 1rem;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            color: var(--color-text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .difficulty-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary-light);
        }
        
        .difficulty-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }
        
        /* Game Canvas Area */
        .game-canvas-wrapper {
            position: relative;
            background: #c0c0c0;
            border-radius: 8px;
            padding: 4px;
            box-shadow: 
                inset 2px 2px 0 #ffffff,
                inset -2px -2px 0 #808080,
                0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        #game-canvas {
            display: block;
            border: 2px solid #808080;
            border-radius: 2px;
        }
        
        /* Loading State */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 9, 11, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--color-text-muted);
            font-size: 1rem;
        }
        
        /* Demo Notice (hidden by default now) */
        .demo-notice {
            display: none;
        }
        
        /* Controls Info */
        .controls-info {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }
        
        .control-key {
            padding: 0.25rem 0.5rem;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
        
        /* Game Stats */
        .game-stats {
            display: flex;
            gap: 2rem;
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .game-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .controls-info {
                flex-direction: column;
                align-items: center;
            }
            
            .difficulty-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .game-canvas-wrapper {
                max-width: 100%;
                overflow: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <a href="/games.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Games
        </a>
        <h1 class="game-title">💣 <span>Minesweeper</span></h1>
        <div style="width: 120px;"></div>
    </header>

    <!-- Game Container -->
    <main class="game-container">
        <!-- Difficulty Selector -->
        <div class="difficulty-selector">
            <button class="difficulty-btn" data-difficulty="easy">Easy (9×9)</button>
            <button class="difficulty-btn active" data-difficulty="medium">Medium (16×16)</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard (24×16)</button>
        </div>
        
        <div class="game-canvas-wrapper" id="game-wrapper">
            <!-- Canvas -->
            <canvas id="game-canvas" width="512" height="572"></canvas>
            
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <p class="loading-text">Loading game...</p>
            </div>
        </div>
        
        <!-- Controls Info -->
        <div class="controls-info">
            <div class="control-item">
                <span class="control-key">Left Click</span>
                <span>Reveal tile</span>
            </div>
            <div class="control-item">
                <span class="control-key">Right Click</span>
                <span>Flag/unflag</span>
            </div>
            <div class="control-item">
                <span class="control-key">Middle Click</span>
                <span>Chord</span>
            </div>
            <div class="control-item">
                <span class="control-key">R</span>
                <span>Restart</span>
            </div>
            <div class="control-item">
                <span class="control-key">1/2/3</span>
                <span>Change difficulty</span>
            </div>
        </div>
        
        <!-- Mobile hint -->
        <p style="color: var(--color-text-muted); font-size: 0.8rem; text-align: center;">
            📱 On mobile: Tap to reveal, long-press to flag
        </p>
    </main>

    <!-- Game Script -->
    <script src="minesweeper.js"></script>
    <script>
        // Handle difficulty button clicks
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Update active state
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Change game difficulty
                if (window.game) {
                    window.game.changeDifficulty(this.dataset.difficulty);
                }
            });
        });
    </script>
</body>
</html>
